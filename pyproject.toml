[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "merisor"
description = "Éditeur MERISE avec génération MLD et SQL multi-dialecte"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nouhailler", email = "patrick.nouhailler@gmail.com"},
]
keywords = ["MERISE", "MCD", "MLD", "SQL", "database", "modeling", "PySide6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/nouhailler/merisor"
Documentation = "https://github.com/nouhailler/merisor#readme"
Repository = "https://github.com/nouhailler/merisor.git"
Issues = "https://github.com/nouhailler/merisor/issues"
Changelog = "https://github.com/nouhailler/merisor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
ai = [
    "keyring>=25,<26",
]

[project.gui-scripts]
merisor = "merisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "merisor.__version__"}

[tool.setuptools.package-data]
merisor = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
