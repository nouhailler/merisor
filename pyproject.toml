[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "merisor"
description = "Éditeur MERISE avec génération MLD et SQL multi-dialecte"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nouhailler", email = "patrick.nouhailler@gmail.com"},
]
keywords = ["MERISE", "MCD", "MLD", "SQL", "database", "modeling", "PySide6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.urls]
Homepage = "https://github.com/nouhailler/merisor"
Documentation = "https://github.com/nouhailler/merisor#readme"
Repository = "https://github.com/nouhailler/merisor.git"
Issues = "https://github.com/nouhailler/merisor/issues"
Changelog = "https://github.com/nouhailler/merisor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "tomli>=2,<3; python_version < '3.11'",
]
ai = [
    "keyring>=25,<26",
]
quality = [
    "mypy>=1.15,<2",
    "ruff>=0.12,<1",
]

[project.gui-scripts]
merisor = "merisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "merisor.__version__"}

[tool.setuptools.package-data]
merisor = ["assets/*.png"]

[tool.setuptools.data-files]
"share/doc/merisor" = ["docs/INDEX.md", "docs/PYPI_PUBLISHING.md"]
"share/doc/merisor/images" = ["docs/images/*.png"]
"share/doc/merisor/user" = ["docs/user/*.md"]
"share/doc/merisor/concepts" = ["docs/concepts/*.md"]
"share/doc/merisor/technical" = ["docs/technical/*.md"]
"share/doc/merisor/development" = ["docs/development/*.md"]
"share/doc/merisor/decisions" = ["docs/decisions/*.md"]
"share/doc/merisor/decisions/ADR" = ["docs/decisions/ADR/*.md"]
"share/doc/merisor/examples" = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["merisor"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
show_error_codes = true
pretty = true
