[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merisor"
version = "0.4.0"
description = "Éditeur MERISE avec génération MLD et SQL multi-dialecte"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
ai = [
    "keyring>=25,<26",
]

[project.gui-scripts]
merisor = "merisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
