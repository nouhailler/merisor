name: Python quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, mypy and pytest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime and project tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,ai,quality]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint Python
        run: ruff check .
      - name: Check static typing
        run: mypy
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
