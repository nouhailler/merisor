name: Build Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  python-distribution:
    name: Build Python distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          package_version="$(PYTHONPATH=src python -c 'from merisor import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - name: Build wheel and source archive
        run: python -m pip install --upgrade build twine && python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Store Python distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  release:
    # Construire sur une base plus ancienne améliore la compatibilité glibc de
    # l'AppImage avec Debian 12 et les distributions Linux récentes.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools pyinstaller
      - name: Run tests
        run: python -m pip install -e ".[test,ai]" && QT_QPA_PLATFORM=offscreen pytest
      - name: Build Debian package
        run: ./packaging/build_deb.sh
      - name: Build AppImage
        run: ./packaging/build_appimage.sh
      - name: Smoke-test AppImage
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 5s dist/*.AppImage
          status=$?
          test "$status" -eq 124
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true

  publish-pypi:
    name: Publish Python distribution to PyPI
    needs:
      - python-distribution
      - release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/merisor
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
