name: Build Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Construire sur une base plus ancienne améliore la compatibilité glibc de
    # l'AppImage avec Debian 12 et les distributions Linux récentes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools pyinstaller
      - name: Run tests
        run: python -m pip install -e ".[test,ai]" && QT_QPA_PLATFORM=offscreen pytest
      - name: Build Debian package
        run: ./packaging/build_deb.sh
      - name: Build AppImage
        run: ./packaging/build_appimage.sh
      - name: Smoke-test AppImage
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 5s dist/*.AppImage
          status=$?
          test "$status" -eq 124
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
          generate_release_notes: true
